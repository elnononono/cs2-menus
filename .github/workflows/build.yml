name: Build AMBuild Plugin

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  release:
    types:
      - created

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pisex/ubuntu20:latest

    env:
      HL2SDK_ROOT: "${{ github.workspace }}/external"
      MMS_PATH: "${{ github.workspace }}/external/metamod-source"
      MANIFEST_PATH: "${{ github.workspace }}/external/metamod-source/hl2sdk-manifests"

    steps:
      - name: Generate build number
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        id: buildnumber
        uses: onyxmueller/build-tag-number@v1
        with:
          token: ${{secrets.github_token}}

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qy
          apt-get install -y git clang-10 clang++-10 binutils python3 python3-pip zip

          python3 -m pip install --upgrade pip importlib-metadata
          python3 -m pip install setuptools==45.2.0

          git clone https://github.com/alliedmodders/ambuild.git ambuild
          cd ambuild
          pip3 install .
          cd ..

          mkdir -p external
          cd external
          # Metamod 2.0 (KHook) and the cs2 hl2sdk are pinned: both get updated in several steps after
          # each CS2 update, and building from a half-updated branch breaks the build. Bump the
          # commits deliberately (and rebuild) when a newer SDK is needed.
          MMS_REF=fa6f80e4662e5b96cc2e97722d812f374581dfd8
          HL2SDK_REF=625bfd4e39816ad0e1eae3b3144a3b5425c5c7a0
          fetch_ref() {
            git init -q "$1"
            git -C "$1" remote add origin "$2"
            git -C "$1" fetch -q --depth 1 origin "$3"
            git -C "$1" checkout -q FETCH_HEAD
          }
          fetch_ref metamod-source https://github.com/alliedmodders/metamod-source.git "$MMS_REF"
          # Only the submodules needed to build a plugin, a full recursive clone pulls khook's test dependencies too
          git -C metamod-source submodule update --init --depth 1 third_party/khook third_party/amtl hl2sdk-manifests
          fetch_ref hl2sdk-cs2 https://github.com/alliedmodders/hl2sdk.git "$HL2SDK_REF"

          cd ../..

          # Pinned too: patch_schemaentity.sh is written against this exact revision
          git clone https://github.com/pisex/SchemaEntity.git
          git -C SchemaEntity checkout -q e7965b3c83ec684d44584ee6457c5482ee5d9db1
          bash cs2-menus/.github/patch_schemaentity.sh SchemaEntity

      - name: Configure and build plugin
        shell: bash
        run: |
          set -o pipefail
          mkdir build
          cd build
          python3 ../configure.py -s cs2 --targets x86_64 --enable-optimize --hl2sdk-manifests=./hl2sdk-manifests --mms_path=$MMS_PATH --hl2sdk-root=$HL2SDK_ROOT 2>&1 | tee ../build.log
          ambuild 2>&1 | tee -a ../build.log

      - name: Report compiler errors
        if: failure()
        shell: bash
        run: |
          # Surface the first compiler errors as annotations so they are visible without the raw log
          touch build.log
          errors=$(grep -E "error:|undefined reference|Traceback|Exception" build.log | sort -u)
          if [ -z "$errors" ]; then errors=$(tail -n 30 build.log); fi
          echo "$errors" | head -n 40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          { echo '```'; echo "$errors" | head -n 200; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Package addon into ZIP
        run: |
          cd build/package/addons
          zip -r "${{ github.event.repository.name }}.zip" .
          mv "${{ github.event.repository.name }}.zip" "${GITHUB_WORKSPACE}/"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}
          path: ${{ github.workspace }}/${{ github.event.repository.name }}.zip

      # Releases are tagged with the commit message (e.g. "1.9.0"), so only version-like messages publish one
      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, ' ') }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.head_commit.message }}
          files: ${{ github.workspace }}/${{ github.event.repository.name }}.zip
